:root {
  --ink: #4a2a44; --cream: #fff7ee; --rasp: #ff4f7b; --raspD: #c92f5a; --mint: #4fd29c; --mintD: #22a171;
  --sky: #6cc0ff; --skyD: #3288d0; --butter: #ffcf4a; --butterD: #dc9d19; --lilac: #b49bff; --lilacD: #7b62d6;
  --shadow: rgba(74, 42, 68, .28);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #ffd9ec; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
body { font-family: 'Fredoka', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif; font-weight: 700; color: var(--ink); }
#app { position: fixed; inset: 0; }
#c { position: absolute; inset: 0; width: 100vw; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#labels > * { position: absolute; left: 0; top: 0; pointer-events: auto; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui * { pointer-events: auto; }
#ui .screen, #ui .topbar, #ui .bar, #ui .playtop, #ui .answers, #ui .eq, #ui .shopnav, #ui .spacer { pointer-events: none; }
#ui .screen > *, #ui .bar > *, #ui .topbar > *, #ui .playtop > *, #ui .answers > *, #ui .shopnav > * { pointer-events: auto; }
#ui .spacer, #ui .eq > * { pointer-events: none; }
.screen { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .25s; }
.screen.on { opacity: 1; visibility: visible; }
.spacer { flex: 1; }
img { image-rendering: pixelated; -webkit-user-drag: none; }

/* ---------- buttons */
.btn { border: 0; padding: 0; margin: 0; font: inherit; color: #fff; cursor: pointer; display: grid; place-items: center;
  --bg: var(--mint); --bd: var(--mintD);
  background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.45) 0 18%, transparent 19%), var(--bg);
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.12), 0 6px 0 var(--bd), 0 12px 18px var(--shadow);
  transition: transform .08s, box-shadow .08s; }
.btn.down { transform: translateY(4px) scale(.97); box-shadow: inset 0 -3px 0 rgba(0,0,0,.12), 0 2px 0 var(--bd), 0 5px 10px var(--shadow); }
.btn .ic { width: 58%; height: 58%; filter: drop-shadow(0 2px 0 rgba(0,0,0,.15)); }
.round { border-radius: 50%; width: 64px; height: 64px; }
.round.small { width: 52px; height: 52px; }
.round.mid { width: 76px; height: 76px; }
.round.huge { width: 112px; height: 112px; }
.round.huge .ic { width: 54%; height: 54%; margin-left: 8%; }
.rasp { --bg: var(--rasp); --bd: var(--raspD); }
.mint { --bg: var(--mint); --bd: var(--mintD); }
.sky { --bg: var(--sky); --bd: var(--skyD); }
.butter { --bg: var(--butter); --bd: var(--butterD); }
.lilac { --bg: var(--lilac); --bd: var(--lilacD); }
.ghost { --bg: rgba(255,255,255,.55); --bd: rgba(74,42,68,.18); color: var(--ink); box-shadow: 0 4px 0 var(--bd); }

/* ---------- top bar */
.topbar { position: absolute; top: calc(12px + var(--sat)); left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; z-index: 5; }
.wallet { display: flex; align-items: center; gap: 6px; background: var(--cream); border-radius: 999px; padding: 5px 18px 5px 6px;
  box-shadow: 0 5px 0 rgba(74,42,68,.18), 0 10px 16px var(--shadow); font-size: 34px; line-height: 1; min-width: 96px; }
.wallet img { width: 42px; height: 42px; }
.wallet.bump { animation: bump .35s; }

/* ---------- home bar */
.homebar .bar { position: absolute; left: 0; right: 0; bottom: calc(22px + var(--sab)); display: flex; justify-content: center; align-items: center; gap: 26px; }
.badge { position: absolute; top: -6px; right: -6px; min-width: 30px; height: 30px; border-radius: 15px; padding: 0 7px; background: var(--rasp); color: #fff;
  font-size: 18px; display: grid; place-items: center; box-shadow: 0 3px 0 var(--raspD); }
.btn { position: relative; }
.wiggle { animation: wiggle 1.6s infinite; }

/* ---------- play */
.playtop { position: absolute; top: 0; left: 0; right: 0; }
.playtop > .btn { position: fixed; top: calc(12px + var(--sat)); right: 76px; z-index: 10; }
.topbar { z-index: 10; }
.dots { display: flex; gap: 6px; background: rgba(255,255,255,.55); padding: 6px 10px; border-radius: 999px; position: absolute; top: calc(74px + var(--sat)); left: 50%; transform: translateX(-50%); }
.dot { width: 24px; height: 24px; border-radius: 50%; background: rgba(74,42,68,.14); display: grid; place-items: center; color: var(--butter); }
.dot.on { background: #fff; }
.dot .ic { width: 22px; height: 22px; }
.dot.popin { animation: popin .45s cubic-bezier(.3,1.8,.5,1); }
.eq { position: absolute; top: calc(118px + var(--sat)); left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 8px; }
.chip { min-width: 58px; height: 64px; padding: 0 10px; border-radius: 18px; display: grid; place-items: center; font-size: 46px; color: #fff; --c: var(--lilac);
  background: var(--c); box-shadow: inset 0 -5px 0 rgba(0,0,0,.14), 0 5px 0 rgba(74,42,68,.2); text-shadow: 0 3px 0 rgba(0,0,0,.18); }
.chip.op { background: none; box-shadow: none; color: var(--ink); min-width: 0; padding: 0 2px; text-shadow: 0 3px 0 rgba(255,255,255,.7); }
.chip.q { background: rgba(255,255,255,.75); color: var(--ink); border: 4px dashed rgba(74,42,68,.35); box-shadow: none; text-shadow: none; animation: breathe 1.4s infinite; }
.chip.q.over { background: #ffd4de; border-color: var(--rasp); }
.chip.solved { background: var(--mint); color: #fff; border: 0; animation: none; box-shadow: inset 0 -5px 0 rgba(0,0,0,.14), 0 5px 0 var(--mintD); text-shadow: 0 3px 0 rgba(0,0,0,.18); }
.popin { animation: popin .45s cubic-bezier(.3,1.8,.5,1) both; }
.answers { position: absolute; bottom: calc(26px + var(--sab)); left: 0; right: 0; display: flex; justify-content: center; gap: 18px; }
.answer { width: 96px; height: 96px; border-radius: 50%; --bg: var(--cream); --bd: #e5cdbc; color: var(--ink); font-size: 56px; animation: popin .45s cubic-bezier(.3,1.8,.5,1) both; }
.answer span { transform: translateY(-2px); }
.answer.right { --bg: var(--mint); --bd: var(--mintD); color: #fff; animation: yay .5s; }
.answer.wrong { animation: shake .45s; opacity: .35; }
.answer.fade { opacity: .25; transition: opacity .3s; }
.answer.pulse { animation: glow 1s infinite; }
.countnum { font-size: 26px; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 19px; background: #fff; color: var(--c, var(--ink)); display: grid; place-items: center;
  box-shadow: 0 4px 0 rgba(74,42,68,.2); animation: popin .35s cubic-bezier(.3,1.8,.5,1) both; pointer-events: none !important; }
.countnum.eat { background: var(--c); color: #fff; }
.stonenum { font-size: 22px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.92); display: grid; place-items: center; box-shadow: 0 3px 0 rgba(74,42,68,.25); cursor: pointer; }
.stonenum.start { background: #ff6f9c; color: #fff; }
.stonenum.pick { background: var(--mint); color: #fff; animation: popin .4s cubic-bezier(.3,1.8,.5,1); }
.stonenum.no { animation: shake .45s; background: #ffc9d6; }

/* ---------- shop */
.shopnav { position: absolute; bottom: calc(22px + var(--sab)); left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 18px; }
.pagedots { display: flex; gap: 6px; }
.pd { width: 10px; height: 10px; border-radius: 50%; background: rgba(74,42,68,.2); }
.pd.on { background: var(--rasp); transform: scale(1.3); }
.pricetag { display: flex; align-items: center; gap: 3px; background: var(--cream); padding: 3px 12px 3px 4px; border-radius: 999px; font-size: 30px; line-height: 1;
  box-shadow: 0 4px 0 rgba(74,42,68,.2), 0 8px 12px var(--shadow); cursor: pointer; }
.pricetag img { width: 34px; height: 34px; }
.pricetag.dear { background: #e9e2f3; color: #8f82a8; }
.pricetag.dear img { filter: grayscale(.7) opacity(.7); }
.pricetag.owned { background: var(--mint); color: #fff; padding: 4px 10px; }
.pricetag.owned .ic { width: 32px; height: 32px; }
.paypanel { position: absolute; left: 0; right: 0; bottom: 0; background: var(--cream); border-radius: 30px 30px 0 0; padding: 16px 14px calc(18px + var(--sab));
  box-shadow: 0 -8px 24px var(--shadow); transform: translateY(110%); transition: transform .45s cubic-bezier(.3,1.3,.5,1); display: flex; flex-direction: column; align-items: center; gap: 12px; }
.paypanel.open { transform: none; }
.payhead { display: grid; place-items: center; font-size: 44px; line-height: 1; min-height: 56px; }
.payhead > * { grid-area: 1 / 1; }
.payhead .price { display: flex; align-items: center; gap: 6px; transition: opacity .2s, transform .2s; }
.payhead .price img { width: 46px; height: 46px; }
.payhead.swap .price { opacity: 0; transform: scale(.6); }
.payeq { display: flex; gap: 4px; align-items: center; }
.chip.gold { --c: #f2b320; }
.chip.rasp { --c: var(--rasp); }
.payeq .chip { height: 46px; min-width: 42px; font-size: 32px; border-radius: 14px; }
.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 14px; max-width: 460px; }
.slots.shake { animation: shake .4s; }
.grp { display: flex; gap: 4px; background: rgba(180,155,255,.16); padding: 5px; border-radius: 16px; }
.grp.extra { background: rgba(255,207,74,.25); }
.grp.extra:empty { display: none; }
.slot { width: 34px; height: 34px; border-radius: 50%; border: 3px dashed rgba(123,98,214,.45); display: grid; place-items: center; }
.slot.full { border: 0; }
.slot.full img { width: 36px; height: 36px; }
.slot.missing { animation: missing 1s infinite; border-color: var(--rasp); }
.slot.change.back { animation: back .8s forwards; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 64px; align-items: center; max-width: 480px; }
.token { border: 0; padding: 0; background: none; position: relative; cursor: pointer; transition: transform .15s, opacity .2s; animation: popin .4s cubic-bezier(.3,1.8,.5,1) both; }
.token img { width: 50px; height: 50px; display: block; filter: drop-shadow(0 4px 0 rgba(74,42,68,.2)); }
.token.five img { width: 68px; height: 68px; }
.token.five b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 28px; color: #fff; text-shadow: 0 2px 0 #c77f10, 0 -1px 0 #c77f10, 2px 0 0 #c77f10, -2px 0 0 #c77f10; }
.token.nudge { animation: nudge 1s ease-in-out infinite; }
.token.used { opacity: .18; transform: scale(.8); }
.earn { width: 76px; height: 76px; }
.payask { display: flex; gap: 16px; justify-content: center; }
.answer.small { width: 78px; height: 78px; font-size: 44px; }

/* ---------- book */
